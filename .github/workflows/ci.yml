name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Build Firebase Functions
        run: npm install --prefix functions && npm run build --prefix functions
      - name: Report Firebase Functions dependency advisories
        run: |
          npm audit --prefix functions --json > /tmp/functions-audit.json || true
          node -e "const a=require('/tmp/functions-audit.json'); const v=a.vulnerabilities||{}; for (const [name,item] of Object.entries(v)) console.log(name + ': ' + item.severity + '; fix=' + JSON.stringify(item.fixAvailable) + '; advisories=' + item.via.map(x => typeof x === 'string' ? x : x.title).join(' | ')); console.log('Summary:', JSON.stringify(a.metadata?.vulnerabilities || {}));"
